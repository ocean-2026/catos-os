<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Notepad window</title>
<style>
.win      { background: panel; border: 1px; padding: 0; }
.titlebar { display: flex; flex-direction: row; justify-content: space-between;
            background: bar; padding: 8px; }
.body     { background: bg; padding: 8px; width: 784px; height: 480px; }
.inputbar { display: flex; flex-direction: row; padding: 8px; }
.close    { width: 64px; height: 24px; background: bar; }
</style>
</head>
<body>
  <div class="win" data-blk-drag="title" data-blk-resize="R,B"
       data-blk-resize-edge="6" style="width:800px;height:600px;">
    <div class="titlebar">
      <span>notes.txt</span>
      <button class="close">Close</button>
    </div>
    <div class="body"><span>Edit your notes here.</span></div>
    <div class="inputbar">
      <input type="text" placeholder="Type here..." style="width:784px;height:24px;background:bg;"></input>
    </div>
  </div>
</body>
</html>
