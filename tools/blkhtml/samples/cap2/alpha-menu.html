<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>alpha-menu</title>
</head>
<body>
  <div style="width:400px;height:300px;">
    <div style="width:240px;height:180px;padding:8px;background:panel;"
         data-alpha="192">
      <span style="width:224px;height:48px;" data-alpha="128" data-wrap="2" data-ellipsis="char">Notification one: the nightly build finished successfully with twelve warnings to review before morning standup.</span>
      <span style="width:224px;height:48px;" data-alpha="128" data-wrap="2" data-ellipsis="char">Notification two: disk usage on the data volume has crossed the seventy percent threshold and needs cleanup soon.</span>
    </div>
  </div>
</body>
</html>
