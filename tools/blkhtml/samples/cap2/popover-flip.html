<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>popover-flip</title>
</head>
<body>
  <div style="width:400px;height:300px;">
    <button id="anchor" style="width:80px;height:24px;">Anchor</button>
    <c-popover id="p-up" data-anchor="anchor" data-prefer="up"
               data-max-h="120" style="width:110px;height:48px;">
      <span>Up menu</span>
    </c-popover>
    <c-popover id="p-down" data-anchor="anchor" data-prefer="down"
               data-max-h="120" style="width:110px;height:48px;">
      <span>Down menu</span>
    </c-popover>
    <c-popover id="p-left" data-anchor="anchor" data-prefer="left"
               data-max-h="120" style="width:110px;height:48px;">
      <span>Left menu</span>
    </c-popover>
    <c-popover id="p-right" data-anchor="anchor" data-prefer="right"
               data-max-h="120" style="width:110px;height:48px;">
      <span>Right menu</span>
    </c-popover>
  </div>
</body>
</html>
